<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 196" width="960" height="196" role="img" aria-labelledby="t d">
  <title id="t">A mission, start to finish</title>
  <desc id="d">mission_start (five questions), then mission_record (Ctrl-C to stop; a plain ros2 bag record or the rosbag2 recorder node works too), then mission_close (save or discard). Afterwards: list, export, verify, diff.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5E6852"/>
    </marker>
    <marker id="arrow-wd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4554"/>
    </marker>
    <style>
      .card   { fill: #FBF6F0; stroke: #E2D6CA; }
      .col    { fill: #F3ECE4; }
      .op, .box { fill: #FFFDF9; stroke: #5E6852; stroke-width: 1.5; }
      .file   { fill: #FFFDF9; stroke: #B9AEA2; stroke-width: 1.2; }
      .wd     { fill: #FFFDF9; stroke: #3A4554; stroke-width: 1.5; }
      .after  { fill: #FFFDF9; stroke: #9AA39A; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .store  { fill: #26303D; }
      .head, .step { font: 600 12px "IBM Plex Sans", Helvetica, Arial, sans-serif; letter-spacing: 1.5px; fill: #5E6852; }
      .step   { font-size: 11px; }
      .note   { font: 12px "IBM Plex Sans", Helvetica, Arial, sans-serif; fill: #5F646C; }
      .cmd    { font: 600 14px "JetBrains Mono", Menlo, Consolas, monospace; fill: #26303D; }
      .cmd.big { font-size: 16px; }
      .sub    { font: 12px "IBM Plex Sans", Helvetica, Arial, sans-serif; fill: #5F646C; }
      .sub.big { font-size: 13px; }
      .alt    { font: italic 12px "IBM Plex Sans", Helvetica, Arial, sans-serif; fill: #5E6852; }
      .cmdL   { font: 600 14px "JetBrains Mono", Menlo, Consolas, monospace; fill: #F3EEE8; }
      .subL   { font: 12px "IBM Plex Sans", Helvetica, Arial, sans-serif; fill: #C9D3DA; }
      .lbl    { font: 600 11px "IBM Plex Sans", Helvetica, Arial, sans-serif; fill: #5E6852; }
      .flow   { stroke: #5E6852; stroke-width: 1.8; fill: none; }
      .inner  { stroke: #3A4554; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="959" height="195" rx="12"/>

  <text class="step" x="24" y="34">1 · BRIEF</text>
  <rect class="box" x="24" y="44" width="200" height="116" rx="10"/>
  <text class="cmd big" x="124" y="90" text-anchor="middle">mission_start</text>
  <text class="sub big" x="124" y="116" text-anchor="middle">five questions</text>

  <path class="flow" d="M228,102 H258" marker-end="url(#arrow)"/>

  <text class="step" x="264" y="34">2 · RECORD</text>
  <rect class="box" x="264" y="44" width="200" height="116" rx="10"/>
  <text class="cmd big" x="364" y="90" text-anchor="middle">mission_record</text>
  <text class="sub big" x="364" y="116" text-anchor="middle">Ctrl-C once to stop</text>
  <text class="alt" x="364" y="138" text-anchor="middle">or any ros2 bag record /</text>
  <text class="alt" x="364" y="153" text-anchor="middle">rosbag2 recorder node</text>

  <path class="flow" d="M468,102 H498" marker-end="url(#arrow)"/>

  <text class="step" x="504" y="34">3 · DECIDE</text>
  <rect class="box" x="504" y="44" width="200" height="116" rx="10"/>
  <text class="cmd big" x="604" y="90" text-anchor="middle">mission_close</text>
  <text class="sub big" x="604" y="116" text-anchor="middle">review, then save or discard</text>

  <path class="flow" d="M708,102 H738" marker-end="url(#arrow)"/>

  <text class="step" x="744" y="34">ANY TIME AFTER</text>
  <rect class="after" x="744" y="44" width="192" height="116" rx="10"/>
  <text class="cmd big" x="840" y="90" text-anchor="middle">list · export</text>
  <text class="sub big" x="840" y="116" text-anchor="middle">verify · diff</text>
</svg>
