# Build the documentation site and publish it on GitHub Pages, on every push
# to main that touches it. Pull requests only build it (--strict: a broken
# link or a page missing from the nav fails), so a mistake shows before it
# is merged.
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, requirements-docs.txt, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
